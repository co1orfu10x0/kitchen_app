<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>おうちの食材</title>

<!-- ホーム画面追加時にアプリらしく見せるための設定 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おうちの食材">
<meta name="theme-color" content="#F5F6F1">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" id="appFavicon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">

<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#2B2E26; --bg:#F5F6F1; --muted:#9a9d94; --line:#e4e5df;
    --green:#4F7358; --tomato:#C1543C; --amber:#C98A2B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); overscroll-behavior:none;}
  body{font-family:'Noto Sans JP',sans-serif; color:var(--ink);}
  #app{display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:480px; margin:0 auto; position:relative; overflow:hidden;}
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}

  .header{padding:14px 12px 0 12px; flex-shrink:0;}
  .pencilSm{color:#b7bab0; margin-left:8px; font-size:13px;}

  .tabRow{display:flex; gap:0; margin-bottom:0; padding-left:4px; position:relative; z-index:3;}
  .tabBtn{flex:1; display:flex; align-items:center; justify-content:center; padding:11px 4px 9px 4px; border:none; background:#E7E8E1; font-weight:600; font-size:13px; position:relative; white-space:nowrap; gap:3px; border-radius:12px 12px 0 0; margin-right:-8px; opacity:0.75; transform:translateY(3px); transition:transform 0.15s;}
  .tabBtn.active{font-weight:700; opacity:1; transform:translateY(0); box-shadow:0 -2px 6px rgba(0,0,0,0.1); z-index:2;}
  .badge{margin-left:6px; background:var(--tomato); color:#fff; border-radius:10px; font-size:11px; padding:1px 6px;}

  .notebookPage{flex:1; min-height:0; display:flex; flex-direction:column; background-color:#fff; background-image:repeating-linear-gradient(to bottom, transparent, transparent 27px, rgba(43,46,38,0.06) 27px, rgba(43,46,38,0.06) 28px); border-radius:14px 14px 0 0; margin:0 6px; padding-top:10px; box-shadow:0 -1px 4px rgba(0,0,0,0.06); position:relative; z-index:1; overflow:hidden;}

  .catRow{display:flex; gap:6px; padding:0 14px 10px 14px; overflow-x:auto; flex-shrink:0;}
  .catChip{flex-shrink:0; padding:7px 12px; border-radius:10px 10px 0 0; border:1.5px solid #e4e5df; border-bottom:none; font-size:12.5px; font-weight:600; white-space:nowrap; background:#F5F6F1; color:#8a8d84;}
  .catChip.active{border-color:transparent; font-weight:700; color:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.12);}
  .catEditBtn{flex-shrink:0; width:32px; height:32px; border-radius:50%; border:1px solid #d8dad2; background:#fff; display:flex; align-items:center; justify-content:center; color:#6b6f64;}

  .currentViewBar{display:flex; align-items:center; gap:8px; margin:0 18px 10px 18px; padding:9px 14px; border-radius:12px; flex-shrink:0;}
  .currentViewIcon{font-size:17px;}
  .currentViewName{font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:15px; flex:1;}
  .currentViewCount{font-size:11.5px; font-weight:500; opacity:0.85;}

  .toolbar{display:flex; align-items:center; justify-content:space-between; padding:0 18px 10px 18px; flex-shrink:0;}
  .toolBtn{display:flex; align-items:center; padding:6px 12px; border-radius:10px; border:1px solid var(--line); background:#fff; color:#5b5f57; font-size:12.5px; gap:5px;}
  .tileStepper{display:flex; align-items:center; background:#fff; border:1px solid var(--line); border-radius:10px; padding:2px 4px; gap:2px;}
  .stepperBtn{border:none; background:#E7E8E1; border-radius:6px; width:22px; height:22px; display:flex; align-items:center; justify-content:center; color:var(--ink); font-size:13px;}
  .stepperBtn:disabled{opacity:0.4;}
  .stepperLabel{font-size:12px; color:#5b5f57; padding:0 7px;}
  .viewToggle{display:flex; background:#E7E8E1; border-radius:10px; padding:3px; gap:2px;}
  .viewToggleBtn{border:none; background:transparent; padding:6px 9px; border-radius:8px; color:#8a8d84; font-size:14px;}
  .viewToggleBtn.active{background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,0.08);}

  .suggestBlock{padding:0 18px 4px 18px; flex-shrink:0;}
  .sheetLabelTight{font-size:12.5px; color:var(--muted); font-weight:500; margin:0 0 8px 0; display:flex; align-items:center; justify-content:space-between;}
  .suggestRow{display:flex; gap:7px; overflow-x:auto; padding-bottom:10px;}
  .suggestChip{flex-shrink:0; display:flex; align-items:center; padding:8px 13px; border-radius:18px; border:1.5px solid var(--line); background:#fff; font-size:13px; white-space:nowrap;}

  .list{flex:1; overflow-y:auto; padding:0 18px 110px 18px;}
  .listInner{display:flex; flex-direction:column; gap:8px;}
  .tileGrid{display:grid; gap:8px;}
  .groupHeader{display:flex; align-items:center; font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:14px; margin:14px 2px 8px 2px;}
  .inventoryGroupHeader{width:100%; border:0; background:transparent; padding:0; text-align:left; cursor:pointer; gap:6px;}
  .inventoryGroupArrow{width:16px; flex:0 0 16px; text-align:center; font-size:14px;}
  .groupCount{margin-left:7px; font-weight:500; font-size:11.5px; color:var(--muted); background:#eceee7; border-radius:8px; padding:1px 7px;}
  .emptyState{text-align:center; color:var(--muted); font-size:14px; margin-top:60px; line-height:1.8;}

  .itemRow{display:flex; align-items:center; padding:13px 14px; border-radius:14px; box-shadow:0 1px 3px rgba(43,46,38,0.06); gap:10px; background:#fff;}
  .qtyStepper{display:flex; align-items:center; gap:4px; background:#F5F6F1; border-radius:10px; padding:3px 5px; flex-shrink:0;}
  .qtyStepper button{border:none; background:#E7E8E1; border-radius:6px; width:22px; height:22px; font-size:13px; color:var(--ink); display:flex; align-items:center; justify-content:center;}
  .qtyStepperLg{display:flex; align-items:center; gap:10px;}
  .qtyStepperLg button{border:none; background:#E7E8E1; border-radius:10px; width:38px; height:38px; font-size:17px; color:var(--ink);}
  .qtyNum{font-size:13.5px; font-weight:700; min-width:16px; text-align:center;}
  .tileQtyBadge{position:absolute; top:4px; left:4px; background:var(--amber); color:#fff; font-size:10.5px; font-weight:700; border-radius:8px; padding:2px 6px;}
  .tileTypeIcon{position:absolute; bottom:4px; right:4px; font-size:14px; display:flex;}
  .tileStorageIcon{position:absolute; bottom:4px; left:4px; font-size:11px;}
  .tileNoteDot{position:absolute; top:4px; right:4px; font-size:10px;}
  .tileMakeAhead{
    position:absolute; top:0; left:0; width:26px; height:26px;
    background:#8A5A7A;
    border-top-left-radius:14px;
    border-bottom-right-radius:14px;
    display:block;
    z-index:2;
  }

  .typeBadge{font-size:10.5px; font-weight:600; border-radius:8px; padding:2px 7px; display:inline-flex; align-items:center; gap:3px;}
  .itemNote{font-size:12px; color:#9a9d94; margin-top:2px; padding-left:1px;}
  .qtyMini{font-size:12px; font-weight:700; color:#8a8d84;}
  .miniBadge{font-size:12px;}
  .longPressHint{font-size:11.5px; color:#b3b6ac; text-align:center; padding:2px 0 8px 0;}

  .mealNavRow{display:flex; gap:6px;}
  .mealWeekGrid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; padding:0; width:100%; min-width:0; touch-action:pan-y;}
  .mealDayTile{background:#fff; border-radius:12px; padding:7px 3px; min-height:130px; min-width:0; box-shadow:0 1px 3px rgba(43,46,38,0.06); display:flex; flex-direction:column; align-items:center; transition:width 0.2s ease, min-height 0.2s ease, box-shadow 0.2s ease; position:relative; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;}
  .mealDayTile.expanded{position:relative; width:230%; min-height:150px; justify-self:center; z-index:20; box-shadow:0 10px 28px rgba(0,0,0,0.28); transition:width 0.2s ease, min-height 0.2s ease;}
  .mealDayTile.today{box-shadow:0 2px 8px rgba(0,0,0,0.18);}
  .mealDateNum{font-size:12px; font-weight:700; font-family:'Zen Maru Gothic',sans-serif;}
  .mealDow{font-size:10px; font-weight:600; margin-bottom:6px;}
  .mealSlot{width:100%; font-size:9.5px; color:#5b5f57; line-height:1.3; margin-bottom:3px; min-height:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .mealSlotPicker{display:flex; gap:8px; margin-bottom:4px;}
  .mealSlotChip{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 0; border-radius:12px; border:1.5px solid var(--line); background:#F7F8F4; font-size:14px; font-weight:700; color:#5b5f57;}
  .mealSlotChip.active{background:var(--amber); border-color:var(--amber); color:#fff;}
  .mealSlotDot{width:5px; height:5px; border-radius:50%; background:currentColor; opacity:0.7;}
  .mealSlotSummary{margin-top:14px; border-top:1px solid #f0f1eb;}
  .mealSlotSummaryRow{display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid #f5f6f1;}
  .mealSlotSummaryRow.current{background:#F7F8F4; border-radius:8px;}
  .mealSlotSummaryTag{width:22px; height:22px; border-radius:6px; background:#E7E8E1; color:#5b5f57; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .mealSlotSummaryVal{font-size:13.5px; color:#2B2E26;}
  .dishLogRow{display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:12px; background:#fff; box-shadow:0 1px 3px rgba(43,46,38,0.06); margin-bottom:8px;}
  .dishLogRow.past{opacity:0.5;}
  .dishLogDate{font-size:12px; font-weight:700; color:#5b5f57; display:flex; align-items:center; gap:4px; flex-shrink:0; width:56px;}
  .dishLogSlotTag{background:#E7E8E1; color:#5b5f57; font-size:10px; font-weight:700; border-radius:5px; padding:1px 4px;}
  .dishLogName{flex:1; font-size:14.5px; min-width:0;}
  .dishLogMakeahead{flex-shrink:0; font-size:11.5px; font-weight:600; border:1.5px solid var(--line); background:#F7F8F4; color:#5b5f57; border-radius:8px; padding:6px 9px; white-space:nowrap;}
  .dishLogMakeahead.on{background:#8A5A7A; border-color:#8A5A7A; color:#fff;}
  .mealMonthHeader{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; font-weight:600; padding:0 4px 6px 4px;}
  .mealMonthGrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; padding:0 4px;}
  .mealMonthCell{aspect-ratio:1; background:#fff; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:4px; box-shadow:0 1px 2px rgba(43,46,38,0.05); position:relative;}
  .mealMonthCell.outMonth{background:rgba(255,255,255,0.3); box-shadow:none;}
  .mealMonthCell.today{box-shadow:0 2px 6px rgba(0,0,0,0.2);}
  .mealMonthNum{font-size:11.5px; font-weight:600;}
  .mealCookMark{position:absolute; bottom:4px; font-size:13px;}

  .themeGrid{display:flex; flex-direction:column; gap:8px;}
  .themeSwatch{display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); background:#fff; font-size:14px; font-weight:500; color:var(--ink); text-align:left;}
  .themeSwatch.active{border-color:var(--ink); background:#F7F8F4; font-weight:700;}
  .themeDots{display:flex; gap:3px;}
  .themeDots span{width:14px; height:14px; border-radius:50%; display:inline-block;}
  .bgSwatch{width:38px; height:38px; border-radius:10px; border:1.5px solid #d8dad2; color:var(--ink); font-size:13px; font-weight:700;}
  .bgSwatch.active{border:2.5px solid var(--ink);}
  .tile{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:14px; box-shadow:0 1px 3px rgba(43,46,38,0.06); background:#fff;}
  .checkCircle{border-radius:50%; border:2px solid; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; padding:0; -webkit-appearance:none; appearance:none;}
  .deleteBtn{background:none; border:none; color:#c2c5bb; padding:4px; flex-shrink:0; font-size:15px;}
  .editSheetRow{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid #f0f1eb;}
  .noteTextarea{width:100%; min-height:70px; border-radius:12px; border:1.5px solid var(--line); padding:10px 12px; font-size:16px; font-family:inherit; outline:none; resize:vertical;}
  .dangerBtn{width:100%; padding:12px 0; border-radius:12px; border:1px solid #f0c9c0; background:#fff5f2; color:var(--tomato); font-weight:600; font-size:14px; margin-top:14px;}

  .fab{position:absolute; bottom:26px; right:22px; width:56px; z-index:50; pointer-events:auto; height:56px; border-radius:50%; background:var(--green); border:none; box-shadow:0 4px 14px rgba(79,115,88,0.4); display:flex; align-items:center; justify-content:center; color:#fff; font-size:24px;}

  .shoppingInputBar{display:flex; gap:8px; align-items:center; padding:12px 18px; background:var(--bg); border-top:1px solid var(--line); flex-shrink:0;}
  .textInput{flex:1; padding:11px 14px; border-radius:12px; border:1.5px solid var(--line); font-size:16px; outline:none; background:#fff; min-width:0;}
  .sendBtn{padding:0 16px; height:44px; border-radius:12px; border:none; background:var(--ink); color:#fff; font-weight:500; font-size:14px; flex-shrink:0;}
  .sendBtnFull{width:100%; padding:13px 0; border-radius:12px; border:none; background:var(--ink); color:#fff; font-weight:500; font-size:15px; position:sticky; bottom:0; z-index:5; box-shadow:0 -6px 10px -4px rgba(0,0,0,0.06);}
  .clearBtn{margin-top:4px; padding:10px 0; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--muted); font-size:13px; width:100%;}

  .overlay{position:absolute; inset:0; background:rgba(43,46,38,0.35); display:flex; align-items:flex-end; z-index:10;}
  .sheet{width:100%; max-height:80%; background:#fff; border-top-left-radius:22px; border-top-right-radius:22px; padding:18px 20px 26px 20px; overflow-y:auto; touch-action:pan-y; position:relative;}
  .sheet .textInput{position:relative; z-index:2; pointer-events:auto; touch-action:auto; -webkit-user-select:text; user-select:text; -webkit-appearance:none;}
  .sheetHeader{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .sheetHeader span{font-family:'Zen Maru Gothic',sans-serif; font-size:17px;}
  .sheetLabel{font-size:12.5px; color:var(--muted); font-weight:500; margin:14px 0 8px 0; display:flex; align-items:center; justify-content:space-between;}
  .freqGrid{display:flex; flex-wrap:wrap; gap:6px;}
  .compactFreqGrid{max-height:138px; overflow:hidden;}
  .shoppingAddSheet{padding-top:12px; padding-bottom:18px;}
  .shoppingAddSheet .sheetHeader{margin-bottom:6px;}
  .shoppingAddSheet .sheetLabel{margin:10px 0 6px 0;}
  .shoppingAddSheet .freqGrid{gap:5px;}
  .freqChip{padding:6px 10px; border-radius:14px; border:1.5px solid var(--line); background:#F7F8F4; font-size:12px; display:inline-flex; align-items:center; gap:4px; white-space:nowrap;}
  .freqEditBtn{display:flex; align-items:center; gap:4px; border:1px solid var(--line); background:#fff; border-radius:8px; padding:4px 9px; font-size:12px; color:#5b5f57;}
  .sheetLabelActions{display:flex;align-items:center;gap:5px;}
  .sheetLabelActions .freqEditBtn{padding:4px 8px;}
  .freqEditChip{display:flex; align-items:center; gap:6px; padding:8px 8px 8px 14px; border-radius:18px; background:#F7F8F4; border:1.5px solid var(--line); font-size:13.5px;}
  .freqEditRemove{border:none; background:#e4e5df; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; color:#6b6f64; font-size:11px;}
  .freqEditNote{border:none; background:none; color:#8a8d84; font-size:13px; padding:0;}
  .sheetEditHint{font-size:12.5px;color:var(--muted);margin:-4px 0 10px 0;}
  .reorderBtn{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#5b5f57;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .reorderBtn:disabled{opacity:.28;}
  .dragEditList{display:flex;flex-direction:column;}
  .dragEditRow{touch-action:none;transition:transform .12s,opacity .12s;cursor:grab;}
  .dragEditRow.dragging{opacity:.55;background:#F7F8F4;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .dragHandle{width:34px;min-width:34px;height:38px;border:none;background:transparent;color:#9a9d94;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;}
  .dragHandle::before{content:"☰";}

  .dishIngRow{display:flex; align-items:center; gap:8px; padding:10px 12px; background:#F7F8F4; border-radius:12px;}
  .dishIngStockBadge{font-size:11.5px; font-weight:700; color:#4F7358; background:#4F735822; border-radius:8px; padding:4px 9px; white-space:nowrap;}
  .dishIngActionBtn{font-size:11px; font-weight:600; border:1.5px solid #e4e5df; background:#F7F8F4; color:#2B2E26; border-radius:8px; padding:4px 8px; white-space:nowrap;}
  .iconBtn{background:none; border:none; color:#6b6f64; padding:4px; font-size:18px;}
  .catEditRow{display:flex; align-items:center; padding:10px 4px; border-bottom:1px solid #f0f1eb;}
  .iconChoice{width:34px; height:34px; border-radius:10px; background:#fff; font-size:16px; display:flex; align-items:center; justify-content:center;}
  .colorChoice{width:26px; height:26px; border-radius:50%;}
  .row{display:flex; gap:8px;}
  .wrap{display:flex; gap:6px; flex-wrap:wrap;}
  .familyStatus{padding:12px 14px;border-radius:12px;background:#F7F8F4;border:1px solid var(--line);font-size:13px;line-height:1.6;margin-bottom:10px;}
  .familyCode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:19px;font-weight:700;letter-spacing:1.5px;text-align:center;padding:12px 8px;border-radius:12px;background:#fff;border:1.5px dashed var(--green);margin:8px 0 10px;}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp, runTransaction } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA29LHRKoyJ8uII-eyVbvbR47vEvpamExo",
    authDomain: "kitchen-app-8b43d.firebaseapp.com",
    projectId: "kitchen-app-8b43d",
    storageBucket: "kitchen-app-8b43d.firebasestorage.app",
    messagingSenderId: "333414936076",
    appId: "1:333414936076:web:46e354d8a77fdf1d1e0829",
    measurementId: "G-BZBJWZN6XL"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.firebaseFamily = {
    db, auth, doc, getDoc, setDoc, onSnapshot, serverTimestamp, runTransaction,
    uid: null, familyId: null, shareCode: null, unsubscribe: null,
    ready: false, syncing: false, applyingRemote: false, pendingTimer: null, lastCloudState: null, localWritePending:false, writeQueued:false, pendingMealDeletes:new Set(), pendingItemDeletes:new Set(), pendingShoppingDeletes:new Set(),
    onReady: [],
    whenReady(fn){ this.ready ? fn() : this.onReady.push(fn); },
    async init(){
      const self = this;
      onAuthStateChanged(auth, async (user)=>{
        if (!user) return;
        self.uid = user.uid;
        const saved = loadFamilyLocal();
        if (saved?.familyId) {
          self.familyId = saved.familyId;
          self.shareCode = saved.shareCode || null;
          await self.startListener(false);
        }
        self.ready = true;
        self.onReady.splice(0).forEach(fn=>fn());
        window.dispatchEvent(new CustomEvent('firebase-ready'));
      });
      try { await signInAnonymously(auth); }
      catch (e) { console.error('Firebase匿名認証に失敗', e); }
    },
    async createFamily(){
      if (!this.uid) throw new Error('認証の準備ができていません');
      const familyId = randomId(24);
      const code = makeShareCode();
      const payload = currentCloudState();
      await setDoc(doc(db,'families',familyId), { createdBy:this.uid, createdAt:serverTimestamp(), version:1 });
      await setDoc(doc(db,'shareCodes',code), { familyId, createdBy:this.uid, createdAt:serverTimestamp() });
      await setDoc(doc(db,'families',familyId,'members',this.uid), { uid:this.uid, joinedAt:serverTimestamp() });
      await setDoc(doc(db,'families',familyId,'data','state'), { ...payload, updatedAt:serverTimestamp(), updatedBy:this.uid });
      this.familyId = familyId; this.shareCode = code; this.localWritePending=false; this.writeQueued=false;
      saveFamilyLocal({familyId, shareCode:code});
      await this.startListener(true);
      return code;
    },
    async joinFamily(code){
      if (!this.uid) throw new Error('認証の準備ができていません');
      const normalized = String(code||'').trim().toUpperCase().replace(/[^A-Z0-9-]/g,'');
      if (!normalized) throw new Error('共有コードを入力してください');
      const codeSnap = await getDoc(doc(db,'shareCodes',normalized));
      if (!codeSnap.exists()) throw new Error('共有コードが見つかりません。もう一度確認してください。');
      const familyId = codeSnap.data().familyId;
      await setDoc(doc(db,'families',familyId,'members',this.uid), { uid:this.uid, joinedAt:serverTimestamp() });
      this.familyId = familyId; this.shareCode = normalized; this.localWritePending=false; this.writeQueued=false;
      saveFamilyLocal({familyId, shareCode:normalized});
      await this.startListener(true);
    },
    async startListener(forceReload){
      if (!this.familyId) return;
      if (this.unsubscribe) { this.unsubscribe(); this.unsubscribe=null; }
      this.syncing = true;
      const stateRef = doc(db,'families',this.familyId,'data','state');
      this.unsubscribe = onSnapshot(stateRef, snap=>{
        if (snap.exists()) {
          const data = snap.data();
          // ローカルで削除した直後に、別端末から削除前のスナップショットが
          // 届いても、その古いデータを復活させない。削除の墓標はローカルにも
          // 即時保存しておき、受信データ側にも必ず適用してから画面へ反映する。
          const localDeleted = loadKey('kitchen-deleted', {});
          const incomingDeleted = data['kitchen-deleted'] || {};
          const mergedDeleted = {
            items: {...(incomingDeleted.items||{}), ...(localDeleted.items||{})},
            shopping: {...(incomingDeleted.shopping||{}), ...(localDeleted.shopping||{})},
            meals: {...(incomingDeleted.meals||{}), ...(localDeleted.meals||{})}
          };
          const dataWithDeletes = {...data, 'kitchen-deleted': mergedDeleted};
          const cleanData = removeDeletedFromCloudData(dataWithDeletes);
          const cloudOnly = {};
          CLOUD_DATA_KEYS.forEach(k=>{ if (cleanData[k] !== undefined) cloudOnly[k] = cloneValue(cleanData[k]); });
          if (this.localWritePending) {
            return;
          }
          this.lastCloudState = cloudOnly;
          if (!this.applyingRemote) {
            this.applyingRemote = true;
            applyCloudState(cleanData);
            this.applyingRemote = false;
            render();
          }
        } else if (this.uid) {
          this.queueWrite(true);
        }
        this.syncing = false;
        window.dispatchEvent(new CustomEvent('family-sync-changed'));
      }, err=>{
        console.error('Firestore listener error', err);
        this.syncing = false;
        window.dispatchEvent(new CustomEvent('family-sync-changed'));
      });
    },
    queueWrite(immediate=false){
      if (!this.familyId || !this.ready || this.applyingRemote) return;
      this.localWritePending = true;
      this.writeQueued = true;
      clearTimeout(this.pendingTimer);
      this.pendingTimer = setTimeout(()=>this.writeNow(), immediate?0:350);
    },
    async writeNow(){
      if (!this.familyId || !this.uid || this.applyingRemote) return;
      const stateRef = doc(db,'families',this.familyId,'data','state');
      const localState = currentCloudState();
      const baseState = this.lastCloudState || {};
      const mealDeletes = [...this.pendingMealDeletes];
      this.writeQueued = false;
      try {
        const merged = await runTransaction(db, async tx => {
          const snap = await tx.get(stateRef);
          const remote = snap.exists() ? snap.data() : {};
          const remoteState = {};
          CLOUD_DATA_KEYS.forEach(k=>{ if (remote[k] !== undefined) remoteState[k] = remote[k]; });
          const result = threeWayMerge(baseState, localState, remoteState);
          // 削除IDをFirestore側にも残して、別端末の古いデータとの3-way mergeで
          // 削除済みの食材・買い物・献立が復活しないようにする。
          const itemDeletes = [...this.pendingItemDeletes];
          const shoppingDeletes = [...this.pendingShoppingDeletes];
          const deleted = threeWayMerge(
            baseState['kitchen-deleted'] || {},
            localState['kitchen-deleted'] || {},
            remoteState['kitchen-deleted'] || {}
          ) || {};
          itemDeletes.forEach(id=>{ deleted.items = deleted.items || {}; deleted.items[String(id)] = Date.now(); });
          shoppingDeletes.forEach(id=>{ deleted.shopping = deleted.shopping || {}; deleted.shopping[String(id)] = Date.now(); });
          mealDeletes.forEach(id=>{ deleted.meals = deleted.meals || {}; deleted.meals[String(id)] = Date.now(); });
          result['kitchen-deleted'] = deleted;
          const deletedItems = new Set(Object.keys(deleted.items || {}));
          const deletedShopping = new Set(Object.keys(deleted.shopping || {}));
          const deletedMeals = new Set(Object.keys(deleted.meals || {}));
          if (Array.isArray(result['kitchen-items'])) {
            result['kitchen-items'] = result['kitchen-items'].filter(i=>!deletedItems.has(String(i?.id)));
          }
          if (Array.isArray(result['kitchen-shopping'])) {
            result['kitchen-shopping'] = result['kitchen-shopping'].filter(i=>!deletedShopping.has(String(i?.id)));
          }
          if (result['kitchen-mealplan']) {
            const mealPlan = result['kitchen-mealplan'];
            Object.keys(mealPlan).forEach(date=>{
              const day = mealPlan[date];
              const entries = Array.isArray(day?.entries) ? day.entries : [];
              const kept = entries.filter(e=>!deletedMeals.has(String(e?.id)));
              if (kept.length) mealPlan[date] = {...day, entries:kept};
              else delete mealPlan[date];
            });
          }
          tx.set(stateRef, { ...result, updatedAt:serverTimestamp(), updatedBy:this.uid });
          return result;
        });
        this.lastCloudState = cloneValue(merged);
        // 保存直後はFirestoreのスナップショットを待たず、今回確定した内容をそのまま画面へ反映する。
        // これにより、削除直後に古いスナップショットが一瞬戻してしまうことを防ぐ。
        this.applyingRemote = true;
        applyCloudState(merged);
        this.applyingRemote = false;
        render();
        mealDeletes.forEach(id=>this.pendingMealDeletes.delete(id));
        itemDeletes.forEach(id=>this.pendingItemDeletes.delete(id));
        shoppingDeletes.forEach(id=>this.pendingShoppingDeletes.delete(id));
        this.localWritePending = false;
        if (this.writeQueued) this.writeNow();
      } catch(e) {
        console.error('Firestore保存失敗',e);
        this.localWritePending = false;
      }
    },
    markMealDeleted(id){
      if (!id) return;
      const key=String(id);
      this.pendingMealDeletes.add(key);
      const deleted=loadKey('kitchen-deleted',{});
      deleted.meals=deleted.meals||{};
      deleted.meals[key]=Date.now();
      saveKey('kitchen-deleted',deleted);
    },
    markItemDeleted(id){
      if (!id) return;
      const key=String(id);
      this.pendingItemDeletes.add(key);
      const deleted=loadKey('kitchen-deleted',{});
      deleted.items=deleted.items||{};
      deleted.items[key]=Date.now();
      saveKey('kitchen-deleted',deleted);
    },
    markShoppingDeleted(id){
      if (!id) return;
      const key=String(id);
      this.pendingShoppingDeletes.add(key);
      const deleted=loadKey('kitchen-deleted',{});
      deleted.shopping=deleted.shopping||{};
      deleted.shopping[key]=Date.now();
      saveKey('kitchen-deleted',deleted);
    },
    leave(){
      if (this.unsubscribe) this.unsubscribe();
      this.unsubscribe=null; this.familyId=null; this.shareCode=null; this.localWritePending=false; this.writeQueued=false;
      this.pendingMealDeletes.clear(); this.pendingItemDeletes.clear(); this.pendingShoppingDeletes.clear();
      localStorage.removeItem('kitchen-family');
      window.dispatchEvent(new CustomEvent('family-sync-changed'));
    }
  };

  function randomId(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a,b=>b.toString(16).padStart(2,'0')).join(''); }
  function makeShareCode(){
    const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const a=new Uint32Array(10); crypto.getRandomValues(a);
    let out=''; for(let i=0;i<a.length;i++){ if(i===5) out+='-'; out+=chars[a[i]%chars.length]; } return out;
  }
  function loadFamilyLocal(){ try{return JSON.parse(localStorage.getItem('kitchen-family')||'null')}catch{return null} }
  function saveFamilyLocal(v){ localStorage.setItem('kitchen-family',JSON.stringify(v)); }
  // 家族間で共有するのは「データ」だけ。
  // 端末ごとの操作・表示状態（タブ、カテゴリー選択、表示形式、テーマ等）は共有しない。
  const CLOUD_DATA_KEYS = [
    "kitchen-categories","kitchen-items","kitchen-shopping","kitchen-shopping-categories","kitchen-frequent","kitchen-foodtypes",
    "kitchen-recipes","kitchen-dish-ingredients","kitchen-dish-wishlist","kitchen-mealplan",
    "kitchen-makeahead-marks","kitchen-deleted"
  ];
  function currentCloudState(){
    const out={};
    CLOUD_DATA_KEYS.forEach(k=>{ try{ const v=localStorage.getItem(k); if(v!==null) out[k]=JSON.parse(v); }catch{} });
    return out;
  }
  function cloneValue(v){
    if (v === undefined) return undefined;
    return JSON.parse(JSON.stringify(v));
  }
  function deepEqual(a,b){
    try { return JSON.stringify(a) === JSON.stringify(b); } catch { return a === b; }
  }
  function threeWayMerge(base, local, remote){
    if (deepEqual(local, base)) return cloneValue(remote);
    if (deepEqual(remote, base)) return cloneValue(local);
    if (deepEqual(local, remote)) return cloneValue(local);
    if (Array.isArray(local) && Array.isArray(remote)) {
      const allHaveIds = [...local, ...remote, ...(Array.isArray(base)?base:[])].every(v => v && typeof v === 'object' && !Array.isArray(v) && v.id != null);
      if (allHaveIds) {
        const bm = new Map((base||[]).map(v=>[String(v.id),v]));
        const lm = new Map(local.map(v=>[String(v.id),v]));
        const rm = new Map(remote.map(v=>[String(v.id),v]));
        const order = [...remote.map(v=>String(v.id)), ...local.map(v=>String(v.id))];
        const seen = new Set(), out=[];
        for (const id of order) {
          if (seen.has(id)) continue; seen.add(id);
          const b=bm.get(id), l=lm.get(id), r=rm.get(id);
          if (l===undefined && r===undefined) continue;
          if (l===undefined) { if (b===undefined || !deepEqual(r,b)) out.push(cloneValue(r)); continue; }
          if (r===undefined) { if (b===undefined || !deepEqual(l,b)) out.push(cloneValue(l)); continue; }
          out.push(threeWayMerge(b,l,r));
        }
        return out;
      }
      return cloneValue(local);
    }
    if (local && remote && typeof local === 'object' && typeof remote === 'object' && !Array.isArray(local) && !Array.isArray(remote)) {
      const keys = new Set([...Object.keys(base||{}), ...Object.keys(local), ...Object.keys(remote)]);
      const out={};
      for (const k of keys) {
        const v=threeWayMerge(base?.[k], local?.[k], remote?.[k]);
        if (v !== undefined) out[k]=v;
      }
      return out;
    }
    return cloneValue(local);
  }

  function removeDeletedFromCloudData(data){
    const out = cloneValue(data || {});
    const deleted = out['kitchen-deleted'] || {};
    const itemIds = new Set(Object.keys(deleted.items || {}));
    const shoppingIds = new Set(Object.keys(deleted.shopping || {}));
    const mealIds = new Set(Object.keys(deleted.meals || {}));
    if (Array.isArray(out['kitchen-items'])) {
      out['kitchen-items'] = out['kitchen-items'].filter(i=>!itemIds.has(String(i?.id)));
    }
    if (Array.isArray(out['kitchen-shopping'])) {
      out['kitchen-shopping'] = out['kitchen-shopping'].filter(i=>!shoppingIds.has(String(i?.id)));
    }
    if (out['kitchen-mealplan']) {
      const mealPlan = out['kitchen-mealplan'];
      Object.keys(mealPlan).forEach(date=>{
        const day = mealPlan[date];
        const entries = Array.isArray(day?.entries) ? day.entries : [];
        const kept = entries.filter(e=>!mealIds.has(String(e?.id)));
        if (kept.length) mealPlan[date] = {...day, entries:kept};
        else delete mealPlan[date];
      });
    }
    return out;
  }

  function applyCloudState(data){
    CLOUD_DATA_KEYS.forEach(k=>{ if(data[k]!==undefined) localStorage.setItem(k,JSON.stringify(data[k])); });
    const localTab=loadKey("kitchen-ui-tab", state.tab || "inventory");
    const localSettings = state.settings;
    const localTheme = state.theme;
    const localBgOverride = state.bgOverride;
    const keep={tab:localTab, settings:localSettings, theme:localTheme, bgOverride:localBgOverride, showAddSheet:state.showAddSheet, showCategorySheet:state.showCategorySheet, showFreqEditSheet:state.showFreqEditSheet, showFreqShoppingSheet:state.showFreqShoppingSheet, showOosShoppingSheet:state.showOosShoppingSheet, showOosShoppingEditSheet:state.showOosShoppingEditSheet, showShoppingFreqEditSheet:state.showShoppingFreqEditSheet, showFoodTypeSheet:state.showFoodTypeSheet, showDishSuggestionEditSheet:state.showDishSuggestionEditSheet, showShoppingAddSheet:state.showShoppingAddSheet, showShoppingCategorySheet:state.showShoppingCategorySheet, showThemeSheet:state.showThemeSheet, showFamilySheet:state.showFamilySheet, editingItemId:state.editingItemId, editingShopItemId:state.editingShopItemId, openDishName:state.openDishName, editingMealDate:state.editingMealDate, editingMealEntryId:state.editingMealEntryId};
    state.categories=loadKey('kitchen-categories',DEFAULT_CATEGORIES);
    state.items=loadKey('kitchen-items',[]);
    state.shopping=loadKey('kitchen-shopping',[]);
    state.shoppingCategories=loadKey('kitchen-shopping-categories',[{id:'shopping-default',name:'買い物',color:'#C1543C',icon:'🛒'}]);
    state.shopping.forEach(it=>{ if(it.shoppingCategoryId && !state.shoppingCategories.some(c=>c.id===it.shoppingCategoryId)) it.shoppingCategoryId=null; });
    state.frequentByCategory=loadKey('kitchen-frequent',DEFAULT_FREQUENT_BY_CATEGORY);
    state.foodTypes=loadKey('kitchen-foodtypes',DEFAULT_FOOD_TYPES);
    state.recipeNotes=loadKey('kitchen-recipes',{});
    state.dishIngredients=loadKey('kitchen-dish-ingredients',{});
    state.dishWishlist=loadKey('kitchen-dish-wishlist',[]);
    state.mealPlan=loadKey('kitchen-mealplan',{});
    state.makeAheadMarks=loadKey('kitchen-makeahead-marks',{});
    Object.assign(state,keep);
    if (!(state.settings.activeCategory==='all'||state.categories.find(c=>c.id===state.settings.activeCategory))) state.settings.activeCategory=state.categories[0]?.id||'fridge';
    if (!state.settings.sortModeByCategory) state.settings.sortModeByCategory={};
    if (!state.settings.shoppingViewMode) state.settings.shoppingViewMode='tile';
    if (!state.settings.mealViewMode) state.settings.mealViewMode='week';
    state.titleDraft=state.settings.title||DEFAULT_TITLE;
    applyColors();
  }

  window.addEventListener('DOMContentLoaded',()=>window.firebaseFamily.init());

/* ---------- localStorage ヘルパー（この端末にずっと保存されます） ---------- */
function loadKey(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function saveKey(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error(e); }
}

/* ---------- 日付ヘルパー ---------- */
function isoDate(d){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function todayISO(){ return isoDate(new Date()); }
function addDays(iso,n){ const d=parseISO(iso); d.setDate(d.getDate()+n); return isoDate(d); }
function addMonths(iso,n){ const d=parseISO(iso); d.setMonth(d.getMonth()+n); return isoDate(d); }
function startOfWeek(iso){ return addDays(iso, -parseISO(iso).getDay()); }
const DOW_LABEL = ['日','月','火','水','木','金','土'];

const SLOT_LABELS = { breakfast:"朝", lunch:"昼", dinner:"夜", snack:"間" };
function slotBadgeHTML(slot, size){
  if (!slot) return "";
  size = size || 16;
  const color = SLOT_COLORS[slot] || "#9a9d94";
  const label = SLOT_LABELS[slot] || "";
  return `<span style="display:inline-flex;align-items:center;justify-content:center;width:${size}px;height:${size}px;min-width:${size}px;border-radius:50%;background:${color};color:#fff;font-size:${Math.round(size*0.55)}px;font-weight:700;flex-shrink:0;line-height:1">${label}</span>`;
}
function isHoliday(iso){ return JAPANESE_HOLIDAYS.has(iso); }
function dateColor(iso){
  const dow = parseISO(iso).getDay();
  if (isHoliday(iso) || dow===0) return "#C1543C";
  if (dow===6) return "#4A6FA5";
  return null;
}

function getMealEntries(iso){

function addMealEntry(iso, name, slot){
  const t = (name||"").trim(); if(!t) return;
  if (!state.mealPlan[iso]) state.mealPlan[iso] = { entries: [] };
  if (!state.mealPlan[iso].entries) state.mealPlan[iso].entries = [];
  const id = uid();
  state.mealPlan[iso].entries.push({ id, name: t, slot: slot || null, source: "calendar" });
  persist();
}
function removeMealEntry(iso, entryId){
  if (!iso || !entryId) return;
  const entries = (state.mealPlan[iso]?.entries || []).filter(e=>e.id!==entryId);
  if (entries.length) state.mealPlan[iso] = { ...(state.mealPlan[iso]||{}), entries };
  else delete state.mealPlan[iso];
  delete state.makeAheadMarks[makeAheadKey(iso, entryId)];
  if (window.firebaseFamily) window.firebaseFamily.markMealDeleted(entryId);
  persist();
}
function renameMealEntry(iso, entryId, newName){
  const t = (newName||"").trim();
  if (!t) return;
  const entry = getMealEntries(iso).find(e=>e.id===entryId);
  if (entry){ entry.name = t; persist(); }
}
function editMealEntry(iso, entryId){
  const entry = getMealEntries(iso).find(e=>e.id===entryId);

  state.mealNewText = entry.name || "";

function saveMealEntryEdit(iso, entryId, name, slot){
  const t=(name||"").trim();
  const entry=getMealEntries(iso).find(e=>e.id===entryId);
  if (!entry || !t) return false;
  entry.name=t;
  entry.slot=slot||null;
  return true;
}
function moveMealEntry(isoFrom, entryId, isoTo){
  if (!isoFrom || !entryId || !isoTo || isoFrom === isoTo) return false;
  const fromEntries = getMealEntries(isoFrom);
  const idx = fromEntries.findIndex(e=>e.id===entryId);
  if (idx < 0) return false;
  const entry = fromEntries[idx];
  const remaining = fromEntries.filter(e=>e.id!==entryId);
  if (remaining.length) state.mealPlan[isoFrom] = {...(state.mealPlan[isoFrom]||{}), entries:remaining};
  else delete state.mealPlan[isoFrom];
  if (!state.mealPlan[isoTo]) state.mealPlan[isoTo] = {entries:[]};
  if (!Array.isArray(state.mealPlan[isoTo].entries)) state.mealPlan[isoTo].entries = [];
  state.mealPlan[isoTo].entries.push(entry);
  return true;
}

function getAllDishLogRows(){
  const rows = [];
  const undated = [];
  Object.keys(state.mealPlan).forEach(iso=>{
    const entries = getMealEntries(iso);
    if (iso === "_undated"){
      entries.forEach(e=>{ undated.push({ date: null, id: e.id, name: e.name, slot: e.slot }); });
      return;
    }
    entries.forEach(e=>{
      rows.push({ date: iso, id: e.id, name: e.name, slot: e.slot });
    });
  });
  const today = todayISO();
  const upcoming = rows.filter(r=>r.date >= today).sort((a,b)=>a.date.localeCompare(b.date));
  const past = rows.filter(r=>r.date < today).sort((a,b)=>b.date.localeCompare(a.date));
  return [...undated, ...upcoming, ...past];
}
function makeAheadKey(date, entryId){ return `${date}::${entryId}`; }

  const key = makeAheadKey(date, entryId);
  if (state.makeAheadMarks[key]){
    delete state.makeAheadMarks[key];

    addItem(name, defaultAddCategoryId(), 1, null, true);
    state.makeAheadMarks[key] = true;
  }
  persist(); render();
}

function mealToday(){
  state.mealAnchorDate = todayISO();
  mealWeekRangeStart = -1; mealWeekRangeEnd = 1;
  mealMonthRangeStart = -1; mealMonthRangeEnd = 1;
  expandedMealTile = null;
  render();
  scrollMealToCenter();
}
function scrollMealToCenter(){
  requestAnimationFrame(()=>{
    const el = document.querySelector(".mealDayTile.today, .mealMonthCell.today");
    if (el) el.scrollIntoView({ block:"center" });
    setTimeout(updateMealMonthLabel, 60);
  });
}
function renderMealScrollHTML(){
  const viewMode = state.settings.mealViewMode;
  const tintFor = (iso)=>{
    const d = parseISO(iso);
    const monthKey = d.getFullYear()*12 + d.getMonth();
    return (monthKey % 2 === 0) ? "#FFFFFF" : "#E7E8E4";
  };
  if (viewMode === "week"){
    const baseStart = startOfWeek(state.mealAnchorDate);
    const rangeStartIso = addDays(baseStart, mealWeekRangeStart*7);
    const rangeEndIso = addDays(baseStart, mealWeekRangeEnd*7 + 6);
    let html = `<div class="mealWeekGrid">`;
    let cur = rangeStartIso;
    while (cur <= rangeEndIso){
      const d = parseISO(cur);
      const isToday = cur === todayISO();
      const col = isToday ? "#fff" : (dateColor(cur) || "#2B2E26");
      const bg = isToday ? "var(--amber)" : tintFor(cur);
      const entries = getMealEntries(cur);
      const isExpanded = expandedMealTile === cur;
      const shown = isExpanded ? entries : entries.slice(0,4);
      const extra = isExpanded ? 0 : entries.length - shown.length;
      const expandedAlign = isExpanded ? (d.getDay() === 0 ? 'justify-self:start;' : (d.getDay() >= 5 ? 'justify-self:end;' : 'justify-self:center;')) : '';
      html += `<div class="mealDayTile ${isToday?'today':''} ${isExpanded?'expanded':''}" style="background:${bg};${expandedAlign}" data-action="open-meal-day" data-date="${cur}" data-scrubtile="${cur}">
        <div class="mealDateNum" style="color:${col}">${d.getMonth()+1}/${d.getDate()}</div>
        <div class="mealDow" style="color:${col}">${DOW_LABEL[d.getDay()]}</div>
        ${shown.map(e=>`<div class="mealSlot" style="color:${isToday?'#fff':'#5b5f57'};display:flex;align-items:center;gap:3px;${isExpanded?'white-space:nowrap;overflow:visible;':''}">${slotBadgeHTML(e.slot,11)}<span style="${isExpanded?'white-space:nowrap':'overflow:hidden;text-overflow:ellipsis;white-space:nowrap'}">${esc(e.name)}</span></div>`).join("")}
        ${extra>0?`<div class="mealSlot" style="color:${isToday?'#fff':'#9a9d94'};font-weight:700">+${extra}</div>`:''}
      </div>`;
      cur = addDays(cur,1);
    }
    html += `</div>`;
    return html;
  } else {
    const startMonthIso = addMonths(state.mealAnchorDate, mealMonthRangeStart);
    const endMonthIso = addMonths(state.mealAnchorDate, mealMonthRangeEnd);
    const sa = parseISO(startMonthIso), ea = parseISO(endMonthIso);
    const rangeStartIso = startOfWeek(isoDate(new Date(sa.getFullYear(), sa.getMonth(), 1)));
    const lastDayOfEndMonth = new Date(ea.getFullYear(), ea.getMonth()+1, 0);
    let rangeEndIso = isoDate(lastDayOfEndMonth);
    rangeEndIso = addDays(rangeEndIso, 6 - parseISO(rangeEndIso).getDay());
    let html = `<div class="mealMonthGrid">`;
    let cur = rangeStartIso;
    while (cur <= rangeEndIso){
      const d = parseISO(cur);
      const isToday = cur === todayISO();
      const col = isToday ? "#fff" : (dateColor(cur) || "#2B2E26");
      const bg = isToday ? "var(--amber)" : tintFor(cur);
      const has = hasMealEntry(cur);
      html += `<div class="mealMonthCell ${isToday?'today':''}" style="background:${bg}" data-action="open-meal-day" data-date="${cur}">
        <span class="mealMonthNum" style="color:${col}">${d.getDate()}</span>
        ${has?'<span class="mealCookMark">🍳</span>':''}
      </div>`;
      cur = addDays(cur,1);
    }
    html += `</div>`;
    return html;
  }
}
function refreshMealScroll(){
  const el = document.getElementById("mealScroll");
  if (el) el.innerHTML = renderMealScrollHTML();
}
function updateMealMonthLabel(){
  const scrollEl = document.getElementById("mealScroll");
  const labelEl = document.getElementById("mealMonthLabel");
  if (!scrollEl || !labelEl) return;
  const rect = scrollEl.getBoundingClientRect();
  const probeX = rect.left + rect.width/2;
  const probeY = rect.top + 4;
  const hit = document.elementFromPoint(probeX, probeY);
  const tile = hit && hit.closest("[data-date]");
  if (tile){
    const d = parseISO(tile.dataset.date);
    labelEl.textContent = `${d.getFullYear()}年${d.getMonth()+1}月`;
  }
}
function attachMealScrollHandler(){
  const el = document.getElementById("mealScroll");
  if (!el) return;
  el.addEventListener("scroll", ()=>{
    updateMealMonthLabel();
    if (mealScrollLock) return;
    const nearTop = el.scrollTop < 60;
    const nearBottom = el.scrollTop > el.scrollHeight - el.clientHeight - 60;
    if (!nearTop && !nearBottom) return;
    const isMonth = state.settings.mealViewMode === "month";
    if (nearTop && (isMonth ? mealMonthRangeStart : mealWeekRangeStart) <= -MEAL_RANGE_CAP) return;
    if (nearBottom && (isMonth ? mealMonthRangeEnd : mealWeekRangeEnd) >= MEAL_RANGE_CAP) return;
    mealScrollLock = true;
    const prevScrollTop = el.scrollTop;
    const prevScrollHeight = el.scrollHeight;
    if (nearTop){ if (isMonth) mealMonthRangeStart -= 1; else mealWeekRangeStart -= 1; }
    else { if (isMonth) mealMonthRangeEnd += 1; else mealWeekRangeEnd += 1; }
    refreshMealScroll();
    const heightDiff = el.scrollHeight - prevScrollHeight;
    el.scrollTop = nearTop ? prevScrollTop + heightDiff : prevScrollTop;
    mealScrollLock = false;
  }, { passive:true });
  requestAnimationFrame(updateMealMonthLabel);
}

/* ---------- ロジック ---------- */
function sortItems(arr, mode){
  if (mode === "name") return [...arr].sort((a,b)=>a.name.localeCompare(b.name,"ja"));
  if (mode === "expiry"){
    return [...arr].sort((a,b)=>{
      const ae = a.expiresAt, be = b.expiresAt;
      if (ae && be) return ae.localeCompare(be);
      if (ae && !be) return -1;
      if (!ae && be) return 1;
      return a.addedAt - b.addedAt;
    });
  }
  return [...arr].sort((a,b)=>b.addedAt-a.addedAt);
}
function orderForDisplay(arr, mode){
  const m = mode === "type" ? "added" : mode;
  return [...sortItems(arr.filter(i=>!i.consumed), m), ...sortItems(arr.filter(i=>i.consumed), m)];
}

function groupByFoodType(arr){
  const buckets = new Map();
  state.foodTypes.forEach(t=>buckets.set(t.id, []));
  buckets.set("__none__", []);
  arr.forEach(it=>{
    const key = it.foodTypeId && buckets.has(it.foodTypeId) ? it.foodTypeId : "__none__";
    buckets.get(key).push(it);
  });
  const groups = [];
  state.foodTypes.forEach(t=>{ if(buckets.get(t.id).length) groups.push({ id:t.id, name:t.name, color:t.color, items:buckets.get(t.id) }); });
  if (buckets.get("__none__").length) groups.push({ id:"__none__", name:"未分類", color:"#9a9d94", items:buckets.get("__none__") });
  return groups;
}

function renameDishSuggestion(oldName, newName){
  oldName=(oldName||"").trim(); newName=(newName||"").trim();
  if(!oldName || !newName || oldName===newName) return;
  state.dishWishlist.forEach(d=>{ if(d.name===oldName) d.name=newName; });
  Object.keys(state.recipeNotes).forEach(k=>{
    const list = getRecipeDishes(k).map(d=>d===oldName?newName:d);
    state.recipeNotes[k] = Array.from(new Set(list));
  });
  state.items.forEach(it=>{ if(it.isMakeAhead && it.name===oldName) it.name=newName; });
}
function removeDishSuggestion(name){
  const oldName=(name||"").trim();
  if(!oldName) return;
  state.dishWishlist = state.dishWishlist.filter(d=>d.name!==oldName);
  Object.keys(state.recipeNotes).forEach(k=>{
    const list = getRecipeDishes(k).filter(d=>d!==oldName);
    if (list.length) state.recipeNotes[k]=list; else delete state.recipeNotes[k];
  });
  state.items.forEach(it=>{ if(it.isMakeAhead && it.name===oldName) it.isMakeAhead=false; });
}

function getAllKnownDishNames(){
  const set = new Set();
  Object.keys(state.recipeNotes).forEach(k=>{ getRecipeDishes(k).forEach(d=>set.add(d)); });
  state.items.forEach(it=>{ if (it.isMakeAhead) set.add(it.name); });
  state.dishWishlist.forEach(d=>set.add(d.name));
  Object.values(state.mealPlan||{}).forEach(day=>{
    (day?.entries||[]).forEach(e=>{ if(e?.source === "calendar" || e?.source == null) set.add(e.name); });
  });
  return Array.from(set);
}

function daysUntil(dateStr){
  if (!dateStr) return null;
  const today = parseISO(todayISO());
  const target = parseISO(dateStr);
  return Math.round((target - today) / 86400000);
}
function expiryUrgencyColor(dateStr){
  const days = daysUntil(dateStr);
  if (days === null) return null;
  if (days < 0) return "#8A5A5A";
  if (days <= 1) return "#C1543C";
  if (days <= 3) return "#C98A2B";
  return "#4F7358";
}

function outOfStockSuggestions(){
  const seen = new Map();
  Object.entries(state.frequentByCategory || {}).forEach(([categoryId, names])=>{
    (names || []).forEach(name=>{
      if (state.items.some(i=>i.name===name && !i.consumed)) return;
      const past = [...state.items].filter(i=>i.name===name && i.consumed).sort((a,b)=>(b.addedAt||0)-(a.addedAt||0))[0];
      const catId = past?.categoryId || categoryId;
      const cat = state.categories.find(c=>c.id===catId);
      if (!seen.has(name)) seen.set(name, {name, categoryId:catId, icon:cat?.icon||"📦", color:cat?.color||"#6B7280"});
    });
  });
  return Array.from(seen.values());
}

    <button class="checkCircle" data-action="toggle-consumed" data-id="${it.id}" style="width:22px;height:22px;border-color:${catColor};background:${it.consumed?catColor:'transparent'};color:#fff;opacity:1">${it.consumed?'✓':''}</button>

        <span style="font-size:16px;text-decoration:${it.consumed?'line-through':'none'};color:${it.consumed?'#8a8d84':'#2B2E26'}">${esc(it.name)}</span>
        ${qty>1?`<span class="qtyMini">×${qty}</span>`:''}
        ${ft?`<span class="typeBadge" style="background:${ft.color}22;color:${ft.color}">${iconHTML(ftIconKey,11)} ${esc(ft.name)}</span>`:''}
        ${notes.length?`<span class="miniBadge">📝</span>`:''}
        ${it.isMakeAhead?`<span class="miniBadge" style="color:#8A5A7A" title="作り置き">${iconHTML('makeahead',12)}</span>`:''}
      </div>
      ${notes.length?`<div class="itemNote">→ ${esc(notes.join('、'))}</div>`:''}
    </div>
  </div>`;
}

function render(){
  const s = state;
  const cats = s.categories;
  const activeCat = s.settings.activeCategory;
  const currentCat = cats.find(c=>c.id===activeCat) || cats[0];
  const addCat = activeCat === "all" ? (cats.find(c=>c.id===s.addTargetCategory) || cats[0]) : currentCat;
  const viewMode = s.settings.viewMode, sortMode = getSortMode(activeCat), cols = s.settings.tileColumns;
  const gridStyle = viewMode==="tile" ? `display:grid;gap:8px;grid-template-columns:repeat(${cols},1fr)` : "display:flex;flex-direction:column;gap:8px";

  // 開いているシートのスクロール位置を保持（再描画のたびに先頭へ戻らないように）
  const prevSheetScrolls = Array.from(document.querySelectorAll(".sheet")).map(elx=>elx.scrollTop);
  const prevCatScrolls = Array.from(document.querySelectorAll(".catRow")).map(elx=>elx.scrollLeft);
  const prevMealScrollTop = document.getElementById("mealScroll") ? document.getElementById("mealScroll").scrollTop : null;

  let html = "";

  /* ヘッダー */
  html += `<div class="header">`;
  html += `<div style="display:flex;align-items:center;justify-content:flex-end;padding-bottom:6px">`;
  html += `<button class="catEditBtn" data-action="open-theme-sheet" title="カラー設定">⚙️</button></div>`;
  const TAB_DEFS = [
    { id:"inventory", label:"在庫", color:"var(--green)" },
    { id:"meals", label:"献立", color:"var(--amber)" },
    { id:"shopping", label:"買い物リスト", color:"var(--tomato)", badge: s.shopping.filter(x=>!x.checked).length },
  ];
  html += `<div class="tabRow">`;
  TAB_DEFS.forEach(t=>{
    const on = s.tab===t.id;
    html += `<button class="tabBtn ${on?'active':''}" style="${on?`background:${t.color};color:#fff`:`color:${t.color}`}" data-action="set-tab" data-tab="${t.id}">${t.label}${t.badge?`<span class="badge">${t.badge}</span>`:''}</button>`;
  });
  html += `</div></div>`;
  html += `<div class="notebookPage">`;

  if (s.tab === "inventory"){
    html += `<div class="catRow">`;
    [ALL_CAT, ...cats].forEach(c=>{
      const on = c.id===activeCat;
      const cc = c.color || '#6B7280';
      html += `<button class="catChip ${on?'active':''}" style="color:${on?'#fff':cc};border-color:${on?cc:cc+'66'};${on?`background:${cc};`:''}" data-action="set-category" data-id="${c.id}">${c.icon} ${esc(c.name)}</button>`;
    });
    html += `<button class="catEditBtn" data-action="open-category-sheet">✎</button></div>`;

    const headerCat = activeCat === "all" ? ALL_CAT : currentCat;
    const headerCount = activeCat === "all"
      ? s.items.filter(i=>!i.consumed).length
      : s.items.filter(i=>i.categoryId===activeCat && !i.consumed).length;
    html += `<div class="currentViewBar" style="background:${headerCat.color}14;color:${headerCat.color}">
      <span class="currentViewIcon">${headerCat.icon}</span>
      <span class="currentViewName">${esc(headerCat.name)}</span>
      <span class="currentViewCount">在庫 ${headerCount}件</span>
    </div>`;

    const sortLabel = sortMode==='expiry'?'消費期限順':sortMode==='added'?'追加日':'カテゴリー別';
    html += `<div class="toolbar">
      <button class="toolBtn" data-action="cycle-sort">⇅ ${sortLabel}</button>
      <div style="display:flex;gap:8px;align-items:center">`;
    if (viewMode==="tile"){
      html += `<div class="tileStepper">
        <button class="stepperBtn" data-action="tile-dec" ${cols<=TILE_MIN?'disabled':''}>－</button>
        <span class="stepperLabel">${cols}列</span>
        <button class="stepperBtn" data-action="tile-inc" ${cols>=TILE_MAX?'disabled':''}>＋</button>
      </div>`;
    }
    html += `<div class="viewToggle">
        <button class="viewToggleBtn ${viewMode==='list'?'active':''}" data-action="set-view" data-view="list">≡</button>
        <button class="viewToggleBtn ${viewMode==='tile'?'active':''}" data-action="set-view" data-view="tile">▦</button>
      </div></div></div>`;

    html += `<div class="longPressHint">食材を長押しすると個数・タイプ・メモを編集できます</div>`;
    html += `<div class="list">`;
    if (activeCat === "all"){
      const anyItems = cats.some(c=>s.items.filter(i=>i.categoryId===c.id).length>0);
      if (!anyItems){
        html += `<div class="emptyState">まだ食材が登録されていません。<br>カテゴリーを選んで右下の＋から追加できます。</div>`;
      } else if (sortMode === "type"){
        const groups = groupByFoodType(s.items);
        groups.forEach(g=>{
          const open = isInventoryGroupOpen("type", g.id, "all");
          html += `<div style="margin-bottom:4px">
            <button class="groupHeader inventoryGroupHeader" type="button" data-action="toggle-inventory-group" data-group-kind="type" data-group-id="${esc(g.id)}" data-group-scope="all" style="color:${g.color}">
              <span class="inventoryGroupArrow">${open?'▾':'▸'}</span><span>🏷 ${esc(g.name)}</span><span class="groupCount">${g.items.length}</span>
            </button>
            ${open?`<div style="${gridStyle}">${g.items.map(it=>{
              const c = cats.find(cc=>cc.id===it.categoryId);
              return renderItemHTML(it, c?.color||'#6B7280', viewMode, cols, {storageIcon:c?.icon});
            }).join("")}</div>`:''}
          </div>`;
        });
      } else {
        const allItems = orderForDisplay(s.items, sortMode);
        if (allItems.length){
          html += `<div style="${gridStyle}">${allItems.map(it=>{
            const c = cats.find(cc=>cc.id===it.categoryId);
            return renderItemHTML(it, c?.color||'#6B7280', viewMode, cols, {storageIcon:c?.icon});
          }).join("")}</div>`;
        }
      }
    } else if (sortMode === "type"){
      const catItemsAll = s.items.filter(i=>i.categoryId===activeCat);
      if (catItemsAll.length===0){
        html += `<div class="emptyState">「${esc(currentCat?.name||'')}」にはまだ食材がありません。<br>右下の＋から追加できます。</div>`;
      }
      const groups = groupByFoodType(catItemsAll);
      groups.forEach(g=>{
        const scope = activeCat;
        const open = isInventoryGroupOpen("type", g.id, scope);
        html += `<div style="margin-bottom:4px">
          <button class="groupHeader inventoryGroupHeader" type="button" data-action="toggle-inventory-group" data-group-kind="type" data-group-id="${esc(g.id)}" data-group-scope="${esc(scope)}" style="color:${g.color}">
            <span class="inventoryGroupArrow">${open?'▾':'▸'}</span><span>🏷 ${esc(g.name)}</span><span class="groupCount">${g.items.length}</span>
          </button>
          ${open?`<div style="${gridStyle}">${g.items.map(it=>renderItemHTML(it, (cats.find(cc=>cc.id===it.categoryId)?.color || currentCat?.color || "#6B7280"), viewMode, cols)).join("")}</div>`:''}
        </div>`;
      });
    } else {
      const catItems = orderForDisplay(s.items.filter(i=>i.categoryId===activeCat), sortMode);
      if (catItems.length===0){
        html += `<div class="emptyState">「${esc(currentCat?.name||'')}」にはまだ食材がありません。<br>右下の＋から追加できます。</div>`;
      }
      html += `<div style="${gridStyle}">${catItems.map(it=>renderItemHTML(it, (cats.find(cc=>cc.id===it.categoryId)?.color || currentCat?.color || "#6B7280"), viewMode, cols)).join("")}</div>`;
    }
    html += `</div>`;

    html += `<button class="fab" data-action="open-add-sheet">＋</button>`;
  }

  if (s.tab === "shopping"){
    const activeShopCat = s.settings.activeShoppingCategory || "all";
    const visibleShopping = activeShopCat === "all" ? s.shopping : s.shopping.filter(x=>x.shoppingCategoryId===activeShopCat);
    const unchecked = visibleShopping.filter(x=>!x.checked).length;
    const shopView = s.settings.shoppingViewMode;
    html += `<div class="catRow">`;
    [{id:"all",name:"すべて"}, ...s.shoppingCategories].forEach((c,idx)=>{
      const on = c.id===activeShopCat;
      const cc = shoppingCategoryColor(c, idx-1);
      html += `<button class="catChip ${on?'active':''}" style="${on?`background:${cc};border-color:${cc};color:#fff`:`color:${cc};border-color:${cc}44`}" data-action="set-shopping-category" data-id="${c.id}">${esc(c.name)}</button>`;
    });
    html += `<button class="catEditBtn" data-action="open-shopping-category-sheet">✎</button></div>`;
    const activeShopName = activeShopCat === "all" ? "すべて" : (s.shoppingCategories.find(c=>c.id===activeShopCat)?.name || "すべて");
    html += `<div class="currentViewBar" style="background:#C1543C14;color:#C1543C">
      <span class="currentViewIcon">🛒</span>
      <span class="currentViewName">${esc(activeShopName)}</span>
      <span class="currentViewCount">未購入 ${unchecked}件</span>
    </div>`;
    html += `<div class="toolbar" style="justify-content:flex-end">
      <div class="viewToggle">
        <button class="viewToggleBtn ${shopView==='list'?'active':''}" data-action="set-shop-view" data-view="list">≡</button>
        <button class="viewToggleBtn ${shopView==='tile'?'active':''}" data-action="set-shop-view" data-view="tile">▦</button>
      </div>
    </div>`;

    const renderShopItems = (items)=>{
      let out = "";
      if (shopView === "tile"){
        out += `<div class="tileGrid" style="grid-template-columns:repeat(4,1fr)">`;
        items.forEach(it=>{
          const qty = it.qty || 1;
          const len = it.name.length;
          const fs = len > 9 ? 9.5 : len > 6 ? 10.5 : 12;
          out += `<div class="tile" data-longpress="shop" data-id="${it.id}" data-action="toggle-shop-checked" style="padding:8px 4px 8px 4px;height:82px;overflow:hidden;opacity:${it.checked?0.45:1};background:${it.checked?'#EFEFEA':'#FFFFFF'}">
            ${qty>1?`<span class="tileQtyBadge">×${qty}</span>`:''}
            <div class="checkCircle" style="width:17px;height:17px;border-color:${it.checked?'#9a9d94':'#C98A2B'};background:${it.checked?'#9a9d94':'transparent'};margin-bottom:5px;">${it.checked?'✓':''}</div>
            <span style="font-size:${fs}px;text-align:center;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-decoration:${it.checked?'line-through':'none'};color:${it.checked?'#8a8d84':'#2B2E26'}">${esc(it.name)}</span>
          </div>`;
        });
        out += `</div>`;
      } else {
        out += `<div class="listInner">`;
        items.forEach(it=>{
          const qty = it.qty || 1;
          out += `<div class="itemRow" data-longpress="shop" data-id="${it.id}" style="opacity:${it.checked?0.45:1};background:${it.checked?'#EFEFEA':'#FFFFFF'}" data-action="toggle-shop-checked">
            <div class="checkCircle" style="width:22px;height:22px;border-color:${it.checked?'#9a9d94':'#C98A2B'};background:${it.checked?'#9a9d94':'transparent'}">${it.checked?'✓':''}</div>
            <span style="flex:1;font-size:16px;text-decoration:${it.checked?'line-through':'none'};color:${it.checked?'#8a8d84':'#2B2E26'}">${esc(it.name)}</span>
            <div class="qtyStepper">
              <button data-action="dec-shop-qty" data-id="${it.id}">－</button>
              <span class="qtyNum">${qty}</span>
              <button data-action="inc-shop-qty" data-id="${it.id}">＋</button>
            </div>
          </div>`;
        });
        out += `</div>`;
      }
      return out;
    };

    html += `<div class="list">`;
    if (visibleShopping.length===0){
      html += `<div class="emptyState">この買い物リストは空です。右下の＋から追加してください。</div>`;
    }
    if (activeShopCat === "all") {
      // 「すべて」では、店舗タブごとにカテゴリー見出しを付けて一覧表示。表示形式はタイル／一覧を維持。
      s.shoppingCategories.forEach((c,idx)=>{
        const group = s.shopping.filter(x=>x.shoppingCategoryId===c.id);
        if (!group.length) return;
        const cc = shoppingCategoryColor(c, idx);
        html += `<div class="groupHeader" style="color:${cc};margin:12px 2px 8px 2px">${esc(c.name)}</div>`;
        html += renderShopItems(group);
      });
      const unassigned = s.shopping.filter(x=>!x.shoppingCategoryId);
      if (unassigned.length){
        html += `<div class="groupHeader" style="color:var(--tomato);margin:12px 2px 8px 2px">すべて</div>`;
        html += renderShopItems(unassigned);
      }
    } else {
      html += renderShopItems(visibleShopping);
    }
    if (visibleShopping.some(x=>x.checked)){
      html += `<button class="clearBtn" data-action="clear-checked-shopping">購入済みを削除</button>`;
    }
    html += `</div>`;
    html += `</div>`;
    if (!s.showShoppingAddSheet){
      html += `<button class="fab" style="background:var(--tomato)" data-action="open-shopping-add-sheet">＋</button>`;
    }
  }

  /* 買い物リスト追加シート */
  if (s.showShoppingAddSheet){
    const oos = outOfStockSuggestions();
    const oosPreviewNames = getShoppingOosPreviewNames();
    const oosPreview = oos.filter(o=>oosPreviewNames.includes(o.name));
    const flatFreq = getShoppingFrequentPreviewNames();
    html += `<div class="overlay" data-action="close-shopping-add-sheet"><div class="sheet shoppingAddSheet" data-stop>
      <div class="sheetHeader"><span>🛒 買い物リストに追加</span><button class="iconBtn" data-action="close-shopping-add-sheet">✕</button></div>`;
    if (oos.length>0){
      html += `<div class="sheetLabel"><span>在庫切れから追加</span><span class="sheetLabelActions"><button class="freqEditBtn" data-action="open-oos-shopping-sheet">すべて見る</button><button class="freqEditBtn" data-action="open-oos-shopping-edit-sheet">編集</button></span></div><div class="freqGrid compactFreqGrid">`;
      oosPreview.forEach(o=>{
        const sel = isInShoppingList(o.name);
        const cc = o.color || '#6B7280';
        html += `<button class="freqChip" style="background:${sel?cc:cc+'16'};border-color:${sel?cc:cc+'66'};color:${sel?'#fff':cc}" data-action="toggle-shop-suggest" data-name="${esc(o.name)}">${sel?'✓ ':''}${esc(o.name)}</button>`;
      });
      html += `</div>`;
    }
    html += `<div class="sheetLabel"><span>よく買うもの</span><span class="sheetLabelActions"><button class="freqEditBtn" data-action="open-freq-shopping-sheet">すべて見る</button><button class="freqEditBtn" data-action="open-shopping-freq-edit-sheet">編集</button></span></div><div class="freqGrid compactFreqGrid">`;
    flatFreq.forEach(name=>{
      const sel = isInShoppingList(name);
      html += `<button class="freqChip" style="background:${sel?'#4F7358':'#F7F8F4'};border-color:${sel?'#4F7358':'#e4e5df'};color:${sel?'#fff':'#2B2E26'}" data-action="toggle-shop-suggest" data-name="${esc(name)}">${sel?'✓ ':''}${esc(name)}</button>`;
    });
    html += `</div>
      <div class="sheetLabel" style="margin-top:10px">買い物リストを追加</div>
      <form class="row" data-form="shopping-item">
        <input class="textInput" id="shoppingTextInput" placeholder="品目を入力" value="${esc(s.shoppingText)}" data-bind="shoppingText">
        <div class="qtyStepper" data-stop>
          <button type="button" data-action="shop-qty-dec">－</button>
          <span class="qtyNum">${s.shoppingQty}</span>
          <button type="button" data-action="shop-qty-inc">＋</button>
        </div>
        <button class="sendBtn" type="submit">追加</button>
      </form>
    </div></div>`;
  }

  /* 在庫切れから追加・すべて見る */
  if (s.showOosShoppingSheet){
    const oos = outOfStockSuggestions();
    html += `<div class="overlay" data-action="close-oos-shopping-sheet"><div class="sheet" data-stop>
      <div class="sheetHeader"><span>在庫切れから追加</span><button class="iconBtn" data-action="close-oos-shopping-sheet">✕</button></div>`;
    oos.forEach(o=>{
      const sel = isInShoppingList(o.name);
      const cc = o.color || '#6B7280';
      html += `<button class="freqChip" style="margin:3px 3px 3px 0;background:${sel?cc:cc+'16'};border-color:${sel?cc:cc+'66'};color:${sel?'#fff':cc}" data-action="toggle-shop-suggest" data-name="${esc(o.name)}">${sel?'✓ ':''}${esc(o.name)}</button>`;
    });
    if (!oos.length) html += `<div style="color:#9a9d94;font-size:13px">現在、在庫切れの候補はありません。</div>`;
    html += `</div></div>`;
  }

  /* 献立一覧タブ */
  if (s.tab === "meals"){
    const viewMode = s.settings.mealViewMode;
    const initM = parseISO(state.mealAnchorDate);

    html += `<div class="currentViewBar" style="background:#C98A2B14;color:#C98A2B">
      <span class="currentViewIcon">🍳</span>
      <span class="currentViewName">献立一覧</span>
      <span class="currentViewCount" id="mealMonthLabel">${viewMode==='dishlist'?'料理名一覧':viewMode==='wishlist'?'作りたい料理メモ':`${initM.getFullYear()}年${initM.getMonth()+1}月`}</span>
    </div>`;

    html += `<div class="toolbar">`;
    if (viewMode !== "dishlist" && viewMode !== "wishlist"){
      html += `<div class="mealNavRow">
        <button class="toolBtn" data-action="meal-prev">▲</button>
        <button class="toolBtn" data-action="meal-today">TODAY</button>
        <button class="toolBtn" data-action="meal-next">▼</button>
      </div>`;
    } else {
      html += `<div></div>`;
    }
    html += `<div class="viewToggle">
        <button class="viewToggleBtn ${viewMode==='week'?'active':''}" data-action="set-meal-view" data-view="week">週</button>
        <button class="viewToggleBtn ${viewMode==='month'?'active':''}" data-action="set-meal-view" data-view="month">月</button>
        <button class="viewToggleBtn ${viewMode==='dishlist'?'active':''}" data-action="set-meal-view" data-view="dishlist">料理</button>
        <button class="viewToggleBtn ${viewMode==='wishlist'?'active':''}" data-action="set-meal-view" data-view="wishlist">メモ</button>
      </div>
    </div>`;

    if (viewMode === "month"){
      html += `<div class="mealMonthHeader">`;
      DOW_LABEL.forEach((l,i)=>{ html += `<span style="color:${i===0?'#C1543C':i===6?'#4A6FA5':'#9a9d94'}">${l}</span>`; });
      html += `</div>`;
    }

    if (viewMode === "dishlist"){
      html += `<div class="list">${renderDishListHTML()}</div>`;
      html += `<button class="fab" style="background:var(--amber)" data-action="quick-add-dish">＋</button>`;
    } else if (viewMode === "wishlist"){
      html += `<div class="list">${renderWishlistHTML()}</div>`;
    } else {
      html += `<div class="list" id="mealScroll">${renderMealScrollHTML()}</div>`;
    }
  }

  html += `</div>`;

  /* 食材の献立編集シート（1日分） */
  if (s.editingMealDate){
    const iso = s.editingMealDate;
    const isUndated = iso === "_undated";
    const d = isUndated ? null : parseISO(iso);
    const col = isUndated ? null : dateColor(iso);
    const MEAL_SLOTS = [
      { key:"breakfast", label:"朝" },
      { key:"lunch", label:"昼" },
      { key:"dinner", label:"夜" },
      { key:"snack", label:"間" },
    ];
    const dayEntries = getMealEntries(iso);
    html += `<div class="overlay" data-action="close-meal-day"><div class="sheet" data-stop>
      <div class="sheetHeader"><span style="color:${col||'#2B2E26'}">${isUndated?'📌 日付なし':`${d.getMonth()+1}/${d.getDate()}（${DOW_LABEL[d.getDay()]}）`}</span><button class="iconBtn" data-action="close-meal-day">✕</button></div>

      <div class="row" style="margin-bottom:12px">
        <span style="font-size:12.5px;color:#9a9d94;display:flex;align-items:center">日付を${isUndated?'設定':'変更'}：</span>
        <input class="textInput" type="date" value="${isUndated?'':iso}" data-action-input="change-meal-date" style="flex:1">
        ${(!isUndated && state.editingMealEntryId)?`<button class="freqEditBtn" type="button" data-action="move-meal-undated" data-date="${iso}" data-entryid="${state.editingMealEntryId}">日付なし</button>`:''}
      </div>`;

    if (dayEntries.length > 0){
      html += `<div class="sheetLabel">登録済み</div><div class="listInner" style="margin-bottom:12px">`;
      dayEntries.forEach(en=>{
        const marked = !!state.makeAheadMarks[makeAheadKey(iso, en.id)];
        html += `<div class="dishLogRow" style="box-shadow:none;background:#F7F8F4;flex-wrap:wrap">
          ${slotBadgeHTML(en.slot,18)}
          <span class="dishLogName">${esc(en.name)}</span>
          <button class="freqEditBtn" data-action="open-dish-detail" data-name="${esc(en.name)}">詳細追加</button>
          <button class="dishLogMakeahead ${marked?'on':''}" data-action="toggle-makeahead" data-date="${iso}" data-entryid="${en.id}" data-name="${esc(en.name)}">${marked?'✓ 作り置き':'作り置き'}</button>
          <button class="freqEditBtn" data-action="edit-meal-entry" data-date="${iso}" data-entryid="${en.id}">編集</button>
          <button class="freqEditRemove" type="button" data-action="remove-meal-entry" data-date="${iso}" data-entryid="${en.id}">✕</button>
        </div>`;
      });
      html += `</div>`;
    }

    html += `<div class="sheetLabel">食事の種類（任意）</div>
      <div class="mealSlotPicker">`;
    MEAL_SLOTS.forEach(f=>{
      const on = f.key === s.mealNewSlot;
      const c = SLOT_COLORS[f.key];
      html += `<button class="mealSlotChip ${on?'active':''}" style="${on?`background:${c};border-color:${c}`:''}" data-action="pick-meal-slot" data-slot="${f.key}">
        <span class="mealSlotChipLabel">${f.label}</span>

/* ---------- 編集画面の長押しドラッグ並び替え ---------- */
(function setupCategoryDrag(){
  const appEl = document.getElementById("app");
  if (appEl.dataset.categoryDragReady === "1") return;
  appEl.dataset.categoryDragReady = "1";

  let drag = null;
  const cancel = ()=>{
    if (!drag) return;
    clearTimeout(drag.timer);
    if (drag.row) drag.row.classList.remove("dragging");
    if (drag.row) drag.row.style.transform = "";
    drag = null;
  };

  appEl.addEventListener("pointerdown", (e)=>{
    const handle = e.target.closest(".dragHandle");
    if (!handle) return;
    const row = handle.closest(".dragEditRow");
    const list = row?.closest("[data-drag-list]");
    if (!row || !list) return;
    const startY = e.clientY;
    drag = {handle,row,list,startY,lastY:startY,active:false,timer:null};
    drag.timer = setTimeout(()=>{
      if (!drag) return;
      drag.active = true;
      row.classList.add("dragging");
      try { handle.setPointerCapture(e.pointerId); } catch(_) {}
    }, 350);
  }, true);

  appEl.addEventListener("pointermove", (e)=>{
    if (!drag) return;
    const dy = e.clientY - drag.startY;
    if (!drag.active){
      if (Math.abs(dy) > 8) cancel();
      return;
    }
    e.preventDefault();
    drag.lastY = e.clientY;
    const rows = Array.from(drag.list.querySelectorAll(":scope > .dragEditRow")).filter(r=>r!==drag.row);
    let target = null;
    for (const r of rows){
      const rect = r.getBoundingClientRect();
      if (e.clientY < rect.top + rect.height/2){ target = r; break; }
    }
    if (target) drag.list.insertBefore(drag.row, target);
    else if (rows.length) drag.list.appendChild(drag.row);
  }, true);

  const finish = (e)=>{
    if (!drag) return;
    clearTimeout(drag.timer);
    if (!drag.active){ drag = null; return; }
    e.preventDefault();
    const listType = drag.list.dataset.dragList;
    const ids = Array.from(drag.list.querySelectorAll(":scope > .dragEditRow")).map(r=>r.dataset.dragId).filter(Boolean);
    if (listType === "inventory-categories") reorderInventoryCategories(ids);
    if (listType === "shopping-categories") reorderShoppingCategories(ids);
    drag.row.classList.remove("dragging");
    drag = null;
    persist();
    render();
  };
  appEl.addEventListener("pointerup", finish, true);
  appEl.addEventListener("pointercancel", cancel, true);
})();

let noteFlashTimer = null;
let mealFlashTimer = null;
let suppressNextClick = false;
let pressStartXY = null;
function cancelPress(){ clearTimeout(pressTimer); pressTimer = null; pressStartXY = null; }
function startPress(el, x, y){
  cancelPress();
  pressStartXY = {x, y};
  pressTimer = setTimeout(()=>{
    // 長押し後に発生するiOSのclickを1回だけ無視する。
    // これを通常のpointerup処理で解除すると、長押し直後に元のタイル操作まで走ってしまう。

(function setupKeyboardAvoid(){
  if (!window.visualViewport) return;
  const vv = window.visualViewport;
  const onResize = ()=>{
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.querySelectorAll(".sheet").forEach(sheetEl=>{
      sheetEl.style.paddingBottom = kb > 60 ? (kb + 24) + "px" : "";
    });
  };
  vv.addEventListener("resize", onResize);

})();

})();

(function setupLongPress(){
  const appEl = document.getElementById("app");
  appEl.addEventListener("pointerdown", (e)=>{
    if (e.target.closest("input, textarea, select, button")) { cancelPress(); return; }
    const el = e.target.closest("[data-longpress]");
    if (el) startPress(el, e.clientX, e.clientY);
  });
  appEl.addEventListener("pointerup", cancelPress);
  appEl.addEventListener("pointercancel", cancelPress);
  appEl.addEventListener("pointerleave", cancelPress);
  appEl.addEventListener("pointermove", (e)=>{
    if (!pressStartXY) return;
    const dx = Math.abs(e.clientX - pressStartXY.x), dy = Math.abs(e.clientY - pressStartXY.y);
    if (dx > 10 || dy > 10) cancelPress();
  });
  appEl.addEventListener("scroll", cancelPress, true);
})();

/* 週表示：横になぞるとタイルが拡大、縦になぞると通常通りページスクロール */
let weekScrubStart = null;
let weekScrubActive = false;
let weekScrubAxis = null; // "x" | "y" | null(未確定)
(function setupWeekScrub(){
  const appEl = document.getElementById("app");
  const findTileDate = (x, y)=>{
    const hit = document.elementFromPoint(x, y);
    const tile = hit && hit.closest("[data-scrubtile]");
    return tile ? tile.dataset.scrubtile : null;
  };
  appEl.addEventListener("pointerdown", (e)=>{
    const grid = e.target.closest(".mealWeekGrid");
    if (!grid) return;
    weekScrubStart = { x:e.clientX, y:e.clientY };
    weekScrubActive = false;
    weekScrubAxis = null;
  });
  appEl.addEventListener("pointermove", (e)=>{
    if (!weekScrubStart) return;
    const dx = e.clientX - weekScrubStart.x, dy = e.clientY - weekScrubStart.y;
    if (weekScrubAxis === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)){
      weekScrubAxis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      if (weekScrubAxis === "x"){
        weekScrubActive = true;
        suppressNextClick = true;
      } else {
        // 縦方向：ページの方をスクロールさせるのでここでは何もしない
        weekScrubStart = null;
        return;
      }
    }
    if (weekScrubActive){
      e.preventDefault();
      const date = findTileDate(e.clientX, e.clientY);
      if (date && date !== expandedMealTile){
        expandedMealTile = date;
        refreshMealScroll();
      }
    }
  });
  const endScrub = ()=>{
    // 横なぞりだけは、その直後のclickを無視する。
    // 長押しで設定されたsuppressNextClickはここで解除しない。
    if (weekScrubActive) suppressNextClick = false;
    if (weekScrubActive){
      expandedMealTile = null;
      refreshMealScroll();
    }
    weekScrubStart = null;
    weekScrubActive = false;
    weekScrubAxis = null;
  };
  appEl.addEventListener("pointerup", endScrub);
  appEl.addEventListener("pointercancel", endScrub);
})();
