      const code = prompt("家族から受け取った共有コードを入力してください。\n例：ABCD2-EFGH3");
      if (!code) break;
      try { await f.joinFamily(code); render(); alert("家族間共有に参加しました。\n家族のデータを読み込んでいます。"); }
      catch(e) { console.error(e); alert(e?.message || "共有コードの入力に失敗しました。"); }
      break;
    }
    case "copy-family-code": {
      const code = window.firebaseFamily?.shareCode || "";
      if (code) { try { await navigator.clipboard.writeText(code); alert("共有コードをコピーしました。"); } catch { alert(code); } }
      break;
    }
    case "open-theme-sheet": state.showThemeSheet = true; render(); break;
    case "close-theme-sheet": if(e.target===el) state.showThemeSheet = false; render(); break;
    case "pick-theme": state.theme = el.dataset.theme; applyColors(); persist(); render(); break;
    case "pick-bg": state.bgOverride = el.dataset.color || null; applyColors(); persist(); render(); break;
    case "export-backup": exportBackup(); break;
    case "set-meal-view": {
      state.settings.mealViewMode = el.dataset.view;
      mealWeekRangeStart=-1; mealWeekRangeEnd=1; mealMonthRangeStart=-1; mealMonthRangeEnd=1;
      expandedMealTile = null;
      persist(); render();
      if (el.dataset.view === "week" || el.dataset.view === "month") scrollMealToCenter();
      break;
    }
    case "meal-prev": mealPrev(); break;
    case "meal-next": mealNext(); break;
    case "meal-today": mealToday(); break;
    case "open-meal-day": openMealDay(el.dataset.date); break;
    case "edit-meal-entry": editMealEntry(el.dataset.date || state.editingMealDate, el.dataset.entryid); break;
    case "move-meal-undated": {
      const from = el.dataset.date || state.editingMealDate;
      const entryId = el.dataset.entryid;
      if (moveMealEntry(from, entryId, "_undated")) {
        state.editingMealDate = "_undated";
        state.editingMealEntryId = entryId;
        persist();
        render();
      }
      break;
    }
    case "quick-add-dish": openMealDay(todayISO()); break;
    case "quick-add-dish-undated": openMealDay("_undated"); break;
    case "wishlist-to-calendar": addMealEntry("_undated", name, null); render(); break;
    case "remove-wishlist-dish": removeWishlistDish(el.dataset.id); persist(); render(); break;
    case "quick-add-dish-today": addMealEntry("_undated", name, null); render(); break;
    case "close-meal-day": if(e.target===el) closeMealDay(); break;
    case "remove-meal-entry": removeMealEntry(el.dataset.date || state.editingMealDate, el.dataset.entryid); render(); break;
    case "quick-add-meal-entry": addMealEntry(state.editingMealDate, name, state.mealNewSlot); render(); break;
    case "toggle-makeahead": toggleMakeAhead(el.dataset.date, el.dataset.entryid, el.dataset.name); break;
    case "open-dish-detail": {
      const val = el.dataset.name || "";
      if (!val.trim()){ break; }
      openDishDetail(val);
      break;
    }
    case "pick-meal-slot": state.mealNewSlot = (state.mealNewSlot === el.dataset.slot) ? null : el.dataset.slot; render(); break;
    case "close-dish-detail": if(e.target===el) closeDishDetail(); break;
    case "dish-ing-add-stock": addItem(name, defaultAddCategoryId()); persist(); render(); break;
    case "remove-dish-ing": removeDishIngredient(state.openDishName, name); persist(); render(); break;
  }
});

document.getElementById("app").addEventListener("input", (e)=>{
  const bind = e.target.dataset.bind;
  if (bind){
    if (bind.indexOf(".") > -1){
      const [obj,key] = bind.split(".");
      if (state[obj]) state[obj][key] = e.target.value;
    } else if (bind === "dishEditDraft") {
      if (!state.dishEditDrafts) state.dishEditDrafts = {};
      state.dishEditDrafts[e.target.dataset.oldName || ""] = e.target.value;
    } else {
      state[bind] = e.target.value;
    }
  }
  if (e.target.dataset.actionInput === "set-expiry"){
    setItemExpiry(e.target.dataset.id, e.target.value);
    persist();
    render();
  }
  if (e.target.dataset.actionInput === "change-meal-date" && e.target.value){
    const from = state.editingMealDate;
    const entryId = state.editingMealEntryId;
    const to = e.target.value;
    if (entryId && from && from !== to && moveMealEntry(from, entryId, to)) {
      state.editingMealDate = to;
      persist();
      render();
    } else {
      openMealDay(to);
    }
  }
});

document.getElementById("app").addEventListener("submit", (e)=>{
  e.preventDefault();
  const formName = e.target.dataset.form;
  if (formName === "manual-item"){ addItem(state.manualText, currentAddCategoryId(), state.manualQty, state.addFoodType); state.manualText=""; state.manualQty=1; persist(); render(); }
  if (formName === "freq-word"){ addFrequentWord(currentAddCategoryId(), state.newFreqText); state.newFreqText=""; persist(); render(); }
  if (formName === "shopping-item"){ addShoppingItem(state.shoppingText, state.shoppingQty); state.shoppingText=""; state.shoppingQty=1; persist(); render(); }
  if (formName === "shopping-freq-word"){
    const input=e.target.querySelector("[data-bind=\"newShoppingFreqText\"]");
    const cat=e.target.querySelector("[data-bind=\"newShoppingFreqCatId\"]");
    addFrequentWord(cat?.value || state.categories[0]?.id, input?.value || "");
    state.newShoppingFreqText="";
    state.newShoppingFreqCatId=cat?.value || state.categories[0]?.id || null;
    persist(); render();
  }
  if (formName === "add-shopping-category"){ addShoppingCategory(); persist(); render(); }
  if (formName === "food-type"){ addFoodType(state.newFoodTypeName, state.newFoodTypeIcon); state.newFoodTypeName=""; persist(); render(); }
  if (formName === "dish-ingredient"){ addDishIngredient(state.openDishName, state.newDishIngredient); state.newDishIngredient=""; persist(); render(); }
  if (formName === "wishlist-dish"){ addWishlistDish(state.newWishlistName); state.newWishlistName=""; persist(); render(); }
  if (formName === "item-note-dish"){
    addRecipeDish(e.target.dataset.itemname, state.noteDraft);
    state.noteDraft = "";
    persist(); render();
  }
  if (formName === "rename-shop-item"){
    renameShopItem(e.target.dataset.id, state.shopRenameDraft);
    persist(); render();
  }
  if (formName === "rename-shopping-category"){
    const input = e.target.querySelector("[data-bind=\"shoppingCatName\"]");
    renameShoppingCategory(e.target.dataset.id, input?.value || "");
    persist(); render();
  }
  if (formName === "meal-entry"){
    let ok = false;
    if (state.editingMealEntryId){
      ok = saveMealEntryEdit(state.editingMealDate, state.editingMealEntryId, state.mealNewText, state.mealNewSlot);
      if (ok) state.editingMealEntryId = null;
    } else {
      addMealEntry(state.editingMealDate, state.mealNewText, state.mealNewSlot);
      ok = true;
    }
    if (ok){
      state.mealNewText = "";
      state.mealNewSlot = null;
      persist();
      state.mealSavedFlash = true;
      clearTimeout(mealFlashTimer);
      mealFlashTimer = setTimeout(()=>{ state.mealSavedFlash=false; render(); }, 700);
      render();
      const inp = document.getElementById("mealNewInput");
      if (inp) inp.focus();
    }
  }
});

document.getElementById("app").addEventListener("keydown", (e)=>{
  if (e.key === "Enter" && e.target.id === "titleInput"){ saveTitle(); }
  if (e.key === "Escape" && e.target.id === "titleInput"){ state.editingTitle=false; render(); }
});

document.getElementById("app").addEventListener("blur", (e)=>{
  if (e.target.id === "titleInput") saveTitle();
}, true);

// オーバーレイの外側タップで閉じる
document.getElementById("app").addEventListener("click", (e)=>{
  if (e.target.classList.contains("overlay")){
    state.showAddSheet=false; state.showCategorySheet=false; state.showFreqEditSheet=false; state.showFreqShoppingSheet=false; state.showOosShoppingSheet=false; state.showOosShoppingEditSheet=false; state.showShoppingFreqEditSheet=false; state.showFoodTypeSheet=false; state.showDishSuggestionEditSheet=false; state.editingItemId=null; state.editingShopItemId=null;
    state.showShoppingAddSheet=false; state.showShoppingCategorySheet=false; state.showThemeSheet=false; state.openDishName=null;
    if (state.editingMealDate) closeMealDay(true);
    render();
  }
});

/* アプリアイコン（PWA） */
(function setIcon(){
  const favicon = document.getElementById("appFavicon");
  if (favicon) favicon.href = "icon.svg";
})();

render();
window.addEventListener('family-sync-changed', ()=>{ if (state.showThemeSheet) render(); });
window.addEventListener('firebase-ready', ()=>{ if (window.firebaseFamily?.familyId) render(); });
</script>
</body>
</html>
